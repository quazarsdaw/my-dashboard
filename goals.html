<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<meta name="theme-color" content="#1C1E24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="app-icon.svg">
<title>Цели и Горизонты</title>
<script src="gamification.js?v=401"></script>
<script src="goals-core.js?v=1"></script>
<script src="supabase-sync.js?v=406-sb" defer></script>
<script src="profile-theme.js?v=401"></script>
<script src="topbar.js?v=404" defer></script><style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,"Inter",sans-serif;
  --font-mono:ui-monospace,"SF Mono",monospace;
  --text-primary:#FAFAFA;--text-secondary:#D1D1D1;--text-tertiary:#A0A0A0;
  --success:#6BE3A4;--warning:#F2C063;--danger:#FF6B6B;
  --card-bg:rgba(255,255,255,0.09);--card-radius:16px;
}
html{background:#1C1E24; scrollbar-gutter: stable;}
body{font-family:var(--font-sans);color:var(--text-primary);background:#1C1E24;
  min-height:100vh;max-width:800px;margin:0 auto;-webkit-font-smoothing:antialiased}

body::before{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(ellipse 50% 50% at 82% 14%,var(--app-theme-glow-primary, rgba(192,132,252,0.12)),transparent),
  radial-gradient(ellipse 50% 50% at 18% 90%,var(--app-theme-glow-secondary, rgba(125,211,252,0.08)),transparent);
  filter:blur(40px);animation:bgDrift 36s ease-in-out infinite alternate}
@keyframes bgDrift{0%{transform:translate(0,0)}100%{transform:translate(-12px,8px)}}

.page-title{font-size:28px;font-weight:700;letter-spacing:-0.025em;color:var(--text-primary);margin:16px 0 4px}

/* Horizon Accordions */
.horizon-section { margin-bottom: 12px; }
.horizon-header {
  display: flex; align-items: center; gap: 12px; padding: 14px 18px;
  background: var(--card-bg); border: 1px solid rgba(255,255,255,0.07);
  border-radius: 14px; cursor: pointer; user-select: none;
  transition: background 0.2s, border-color 0.2s;
}
.horizon-header:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.15); }
.horizon-icon { font-size: 18px; width: 24px; text-align: center; }
.horizon-title { flex: 1; font-size: 14px; font-weight: 700; letter-spacing: 0.02em; }
.horizon-count { font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); background: rgba(255,255,255,0.05); padding: 2px 8px; border-radius: 6px; }
.horizon-arrow { font-size: 12px; color: var(--text-tertiary); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.horizon-section.collapsed .horizon-arrow { transform: rotate(-90deg); }
.horizon-content { 
  max-height: 2000px; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s; 
  padding: 10px 4px 20px;
}
.horizon-section.collapsed .horizon-content { max-height: 0; opacity: 0; padding: 0; pointer-events: none; }
.period-nav{display:grid;grid-template-columns:44px minmax(170px,1fr) 44px auto;gap:8px;align-items:center;
  padding:6px 4px 12px}
.period-nav-static{grid-template-columns:1fr}
.period-nav-btn,.period-today,.period-select{min-height:44px;border:1px solid rgba(255,255,255,0.08);
  border-radius:10px;background:rgba(255,255,255,0.045);color:var(--text-secondary);font:inherit}
.period-nav-btn,.period-today{cursor:pointer;font-weight:700}
.period-nav-btn:hover,.period-today:hover,.period-select:hover{background:rgba(255,255,255,0.085);color:var(--text-primary)}
.period-nav-btn:focus-visible,.period-today:focus-visible,.period-select:focus-visible,.month-tag:focus-visible{
  outline:2px solid #7DD3FC;outline-offset:2px}
.period-select{width:100%;padding:0 12px;cursor:pointer;font-weight:700;text-align:center}
.period-today{padding:0 14px;font-size:12px}
.period-static-label{min-height:44px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);
  font-size:12px;font-weight:700;border-radius:10px;background:rgba(255,255,255,0.035)}
.period-empty{padding:24px 16px;text-align:center;color:var(--text-tertiary);font-size:12px}

/* Colors for horizons */
.h-week .horizon-icon { color: #6BE3A4; }
.h-month .horizon-icon { color: #7DD3FC; }
.h-quarter .horizon-icon { color: #F2C063; }
.h-year .horizon-icon { color: #C084FC; }
.h-5year .horizon-icon { color: #FF6B6B; }
.h-life .horizon-icon { color: #FAFAFA; }

/* Goal card */
.goal-card{background:rgba(255,255,255,0.04); border-radius:14px;
  border: 1px solid rgba(255,255,255,0.05); padding:14px 16px; margin-bottom:8px;
  transition: transform 0.15s, border-color 0.15s; cursor:pointer}
.goal-card:hover{ border-color:rgba(255,255,255,0.15); transform: translateY(-1px); }
.goal-card.completed{ opacity: 0.6; background: rgba(107,227,164,0.02); }
.goal-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.goal-title{flex:1;font-size:14px;font-weight:600;}
.goal-pct{font-size:13px;font-weight:900;font-family:var(--font-mono);color:var(--success);text-shadow:0 0 10px rgba(107,227,164,0.3)}
.goal-bar-bg{width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,0.06);overflow:hidden;margin-bottom:6px}
.goal-bar-fill{height:100%;border-radius:2px;transition:width 0.4s;background:var(--success)}
.goal-meta{display:flex;align-items:center;justify-content:space-between; font-size:10px;color:var(--text-tertiary);font-family:var(--font-mono)}

/* Goal Checkbox UI */
.goal-check-btn {
  width: 22px; height: 22px; border-radius: 7px;
  border: 2px solid rgba(255,255,255,0.12);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  background: rgba(255,255,255,0.03);
}
.goal-card.completed .goal-check-btn {
  background: var(--success); border-color: var(--success);
  box-shadow: 0 0 12px rgba(107,227,164,0.3);
}
.goal-check-icon { color: #1c1e24; font-size: 13px; font-weight: 800; opacity: 0; transform: scale(0.5); transition: all 0.2s; }
.goal-card.completed .goal-check-icon { opacity: 1; transform: scale(1); }

/* Add card */
.add-card{background:var(--card-bg); border-radius:var(--card-radius); padding:20px; margin:20px 0 40px; border:1px solid rgba(255,255,255,0.08)}
.add-input{width:100%; padding:12px 16px; border-radius:12px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:#fff; outline:none; margin-bottom:12px;}
.add-row-flex { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.add-select { flex: 1; min-width: 120px; padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #fff; cursor: pointer; outline: none; }
.add-btn-main { width: 100%; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(180deg, #fff, #e0e0e0); color: #1c1e24; font-weight: 800; cursor: pointer; transition: transform 0.1s; }
.add-btn-main:active { transform: scale(0.98); }

/* Edit modal */
.modal-overlay{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal-box{background:#1C1E24;border-radius:24px;padding:24px;max-width:360px;width:100%;border:1px solid rgba(255,255,255,0.1);box-shadow:0 20px 50px rgba(0,0,0,0.5)}
</style>
</head>
<body>

<h1 class="page-title">Горизонты Целей</h1>

<!-- Year Summary with Ring -->
<div class="year-summary-card" style="background: var(--card-bg); border-radius: 20px; padding: 24px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 24px; display: flex; align-items: center; gap: 24px;">
  <div class="year-ring" style="position: relative; width: 80px; height: 80px; flex-shrink: 0;">
    <svg viewBox="0 0 100 100" style="width:100%; height:100%; transform: rotate(-90deg);">
      <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="8"/>
      <circle id="yearRingFg" cx="50" cy="50" r="42" fill="none" stroke="var(--warning)" stroke-width="8" stroke-linecap="round" transition="stroke-dashoffset 0.8s ease"/>
    </svg>
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
      <div id="yearPctText" style="font-size: 18px; font-weight: 800; font-family: var(--font-mono);">0%</div>
      <div style="font-size: 7px; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase;">ГОД</div>
    </div>
  </div>
  <div style="flex: 1;">
    <div id="yearStatusText" style="font-size: 15px; font-weight: 700; margin-bottom: 4px;">2026 год</div>
    <div id="goalsProgressLabel" style="font-size: 11px; color: var(--text-tertiary); font-family: var(--font-mono);">0 из 0 целей выполнено</div>
    <div class="months-grid" id="monthsGrid" style="display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 10px;"></div>
  </div>
</div>

<style>
.month-tag { font: inherit; font-size: 8px; font-weight: 800; text-align: center; min-height: 28px; padding: 3px 0; border: 1px solid transparent; border-radius: 4px; background: rgba(255,255,255,0.03); color: var(--text-tertiary); text-transform: uppercase; cursor: pointer; }
.month-tag.past { text-decoration: line-through; opacity: 0.3; }
.month-tag.current { color: var(--warning); border: 1px solid rgba(242,192,99,0.2); background: rgba(242,192,99,0.05); }
.month-tag.selected { color: var(--text-primary); border-color: rgba(125,211,252,0.45); background: rgba(125,211,252,0.10); opacity: 1; text-decoration: none; }
</style>

<div id="horizonsList">
  <!-- Dynamic horizons will be here -->
</div>

<!-- Add Goal -->
<div class="add-card">
  <h3 style="font-size:14px; margin-bottom:14px;">Новая цель</h3>
  <input class="add-input" id="addTitle" type="text" placeholder="Чего хочешь достичь?" autocomplete="off">
  <div class="add-row-flex">
    <select class="add-select" id="addHorizon">
      <option value="week">Неделя</option>
      <option value="month">Месяц</option>
      <option value="quarter">Квартал</option>
      <option value="year" selected>Год</option>
      <option value="5year">5 лет</option>
      <option value="life">Жизнь</option>
    </select>
    <select class="add-select" id="addType">
      <option value="check">Чекбокс</option>
      <option value="number">Числовая</option>
    </select>
  </div>
  <div class="add-row-flex" id="numberFields" style="display:none">
    <input class="add-input" id="addTarget" type="number" placeholder="Цель (число)" style="flex:1; margin-bottom:0">
    <input class="add-input" id="addUnit" type="text" placeholder="ед." style="width:80px; margin-bottom:0">
  </div>
  <button class="add-btn-main" id="addBtn">Создать цель</button>
</div>

<!-- Edit Progress Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <h3 style="margin-bottom:16px; font-size:16px;">Редактировать цель</h3>
    <div style="margin-bottom:12px;">
        <label for="editTitle" style="font-size:11px; color:var(--text-tertiary); text-transform:uppercase; font-weight:700;">Название</label>
        <input class="add-input" id="editTitle" type="text" maxlength="200" autocomplete="off" style="margin-top:6px;">
    </div>
    <div style="margin-bottom:12px;">
        <label for="editCurrent" style="font-size:11px; color:var(--text-tertiary); text-transform:uppercase; font-weight:700;">Прогресс</label>
        <input class="add-input" id="editCurrent" type="number" style="margin-top:6px;">
    </div>
    <div style="display:flex; gap:8px;">
        <button class="add-btn-main" id="saveBtn">Сохранить</button>
        <button class="add-btn-main" id="closeBtn" style="background:rgba(255,255,255,0.05); color:#fff; width:100px;">Отмена</button>
    </div>
    <button id="delBtn" style="width:100%; margin-top:20px; background:none; border:none; color:var(--danger); font-size:11px; cursor:pointer;">Удалить цель навсегда</button>
  </div>
</div>

<script>
(function(){
  'use strict';
  var G = window.Gamification;
  var Core = window.GoalsCore;

  var HORIZONS = [
    { id: 'week',    name: 'Неделя',      icon: '🌱' },
    { id: 'month',   name: 'Месяц',       icon: '📈' },
    { id: 'quarter', name: 'Квартал',     icon: '🏗️' },
    { id: 'year',    name: 'Год',         icon: '🏰' },
    { id: '5year',   name: '5 Лет',       icon: '🌍' },
    { id: 'life',    name: 'Жизнь',       icon: '♾️' }
  ];

  function getData(){
    var d = G.storeGet('horizons_goals_v2');
    if(!d) {
        // Initial migration from old yearly goals
        var old = G.storeGet('yearly_goals_v1') || { goals: [] };
        d = { goals: (old.goals || []).map(function(g){
          return Object.assign({}, g, { horizon: 'year' });
        }) };
    }
    var normalized = Core.normalizeData(d, new Date());
    if (JSON.stringify(normalized) !== JSON.stringify(d)) setData(normalized);
    return normalized;
  }
  function setData(d){ G.storeSet('horizons_goals_v2', d); }

  function getPeriodSelection(){
    var stored = G.storeGet('goals_period_selection_v1');
    return stored && typeof stored === 'object' ? Object.assign({}, stored) : {};
  }

  function setPeriodSelection(selection){
    G.storeSet('goals_period_selection_v1', Object.assign({}, selection));
  }

  function selectedPeriodFor(horizon){
    var selection = getPeriodSelection();
    var selected = selection[horizon];
    if (selected && Core.formatPeriodLabel(horizon, selected)) return selected;
    return Core.currentPeriodKey(horizon, new Date());
  }

  function periodOptionsHtml(horizon, selected){
    if (horizon === 'life') return '';
    var radius = horizon === 'week' || horizon === 'month' ? 6 : horizon === '5year' ? 3 : 4;
    var options = [];
    for (var offset = -radius; offset <= radius; offset += 1) {
      var key = Core.shiftPeriodKey(horizon, selected, offset);
      var label = Core.formatPeriodLabel(horizon, key);
      options.push('<option value="' + G.esc(key) + '"' + (key === selected ? ' selected' : '') + '>' + G.esc(label) + '</option>');
    }
    return options.join('');
  }

  function periodNavigatorHtml(horizon, selected){
    if (horizon === 'life') {
      return '<div class="period-nav period-nav-static" data-horizon="life"><div class="period-static-label">Вся жизнь</div></div>';
    }
    return `
      <div class="period-nav" data-horizon="${horizon}">
        <button type="button" class="period-nav-btn" data-period-action="previous" aria-label="Предыдущий период" onclick="window.shiftGoalPeriod('${horizon}', -1)">←</button>
        <select class="period-select" aria-label="Выбрать период ${horizon}" onchange="window.selectGoalPeriod('${horizon}', this.value)">
          ${periodOptionsHtml(horizon, selected)}
        </select>
        <button type="button" class="period-nav-btn" data-period-action="next" aria-label="Следующий период" onclick="window.shiftGoalPeriod('${horizon}', 1)">→</button>
        <button type="button" class="period-today" data-period-action="today" onclick="window.resetGoalPeriod('${horizon}')">Сегодня</button>
      </div>
    `;
  }

  function getCollapsed(){ return G.storeGet('goals_collapsed_v1') || {}; }
  function setCollapsed(c){ G.storeSet('goals_collapsed_v1', c); }

  function updateYearProgress(data) {
    var now = new Date();
    var selectedYear = Number(selectedPeriodFor('year'));
    var currentYear = Number(Core.currentPeriodKey('year', now));
    var start = new Date(currentYear, 0, 1);
    var end = new Date(currentYear + 1, 0, 1);
    var pct = selectedYear < currentYear
      ? 100
      : selectedYear > currentYear
        ? 0
        : Math.min(100, Math.max(0, (now - start) / (end - start) * 100));
    
    document.getElementById('yearPctText').textContent = Math.round(pct) + '%';
    
    var ring = document.getElementById('yearRingFg');
    var c = 2 * Math.PI * 42;
    ring.style.strokeDasharray = c;
    ring.style.strokeDashoffset = c - (pct / 100) * c;
    
    document.getElementById('yearStatusText').textContent = selectedYear + ' год';
    
    var goals = data.goals.filter(function(g) {
      return g.horizon === 'year' && g.periodKey === String(selectedYear);
    });
    var doneCount = goals.filter(function(g) { return g.done; }).length;
    document.getElementById('goalsProgressLabel').textContent = doneCount + ' из ' + goals.length + ' целей выполнено';
    
    var grid = document.getElementById('monthsGrid');
    var monthNames = ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'];
    var currentMonthKey = Core.currentPeriodKey('month', now);
    var selectedMonthKey = selectedPeriodFor('month');
    grid.innerHTML = monthNames.map(function(m, i) {
      var monthKey = selectedYear + '-' + String(i + 1).padStart(2, '0');
      var cls = 'month-tag';
      if (monthKey < currentMonthKey) cls += ' past';
      else if (monthKey === currentMonthKey) cls += ' current';
      if (monthKey === selectedMonthKey) cls += ' selected';
      return '<button type="button" class="' + cls + '" aria-label="Открыть ' + G.esc(Core.formatPeriodLabel('month', monthKey)) + '" onclick="window.selectGoalMonth(' + i + ')">' + m + '</button>';
    }).join('');
  }

  function render(){
    var data = getData();
    updateYearProgress(data);
    var collapsed = getCollapsed();
    var container = document.getElementById('horizonsList');
    container.innerHTML = '';

    HORIZONS.forEach(function(h){
      var selectedPeriod = selectedPeriodFor(h.id);
      var goals = Core.sortGoals(data.goals.filter(function(g){
        return g.horizon === h.id && g.periodKey === selectedPeriod;
      }));
      var isCollapsed = !!collapsed[h.id];

      var sec = document.createElement('div');
      sec.className = 'horizon-section h-' + h.id + (isCollapsed ? ' collapsed' : '');
      
      sec.innerHTML = `
        <div class="horizon-header" onclick="window.toggleHorizon('${h.id}')">
          <span class="horizon-icon">${h.icon}</span>
          <span class="horizon-title">${h.name}</span>
          <span class="horizon-count">${goals.length}</span>
          <span class="horizon-arrow">▼</span>
        </div>
        <div class="horizon-content" id="content-${h.id}"></div>
      `;

      var content = sec.querySelector('.horizon-content');
      content.innerHTML = periodNavigatorHtml(h.id, selectedPeriod);
      if(goals.length === 0) {
        var empty = document.createElement('div');
        empty.className = 'period-empty';
        empty.textContent = 'Нет целей в выбранном периоде. Новая цель будет создана здесь.';
        content.appendChild(empty);
      } else {
        goals.forEach(function(g){
            var isCheck = g.type === 'check';
            var pct = isCheck ? (g.done?100:0) : Math.min(100, Math.round((g.current||0)/(g.target||1)*100));
            var card = document.createElement('div');
            card.className = 'goal-card' + (g.done?' completed':'');
            
            if (isCheck) {
                card.innerHTML = `
                    <div class="goal-top" style="margin-bottom:0">
                        <span class="goal-title">${G.esc(g.title)}</span>
                        <div class="goal-check-btn" onclick="event.stopPropagation(); window.toggleGoalStatus('${g.id}')">
                            <span class="goal-check-icon">✓</span>
                        </div>
                    </div>
                `;
                card.onclick = () => openEdit(g);
            } else {
                card.innerHTML = `
                    <div class="goal-top">
                        <span class="goal-title">${G.esc(g.title)}</span>
                        <span class="goal-pct">${pct}%</span>
                    </div>
                    <div class="goal-bar-bg"><div class="goal-bar-fill" style="width:${pct}%"></div></div>
                    <div class="goal-meta">
                        <span>${(g.current||0)+' / '+g.target+' '+(g.unit||'')}</span>
                    </div>
                `;
                card.onclick = () => openEdit(g);
            }
            content.appendChild(card);
        });
      }
      container.appendChild(sec);
    });
  }

  window.selectGoalPeriod = function(horizon, periodKey){
    if (!Core.formatPeriodLabel(horizon, periodKey)) return false;
    var selection = getPeriodSelection();
    if (selection[horizon] === periodKey) return true;
    selection[horizon] = periodKey;
    setPeriodSelection(selection);
    render();
    return true;
  };

  window.shiftGoalPeriod = function(horizon, delta){
    var shifted = Core.shiftPeriodKey(horizon, selectedPeriodFor(horizon), delta);
    return shifted ? window.selectGoalPeriod(horizon, shifted) : false;
  };

  window.resetGoalPeriod = function(horizon){
    var current = Core.currentPeriodKey(horizon, new Date());
    return current ? window.selectGoalPeriod(horizon, current) : false;
  };

  window.selectGoalMonth = function(monthIndex){
    var index = Number(monthIndex);
    if (!Number.isInteger(index) || index < 0 || index > 11) return false;
    var selectedYear = selectedPeriodFor('year');
    var key = selectedYear + '-' + String(index + 1).padStart(2, '0');
    var collapsed = getCollapsed();
    if (collapsed.month) {
      collapsed.month = false;
      setCollapsed(collapsed);
    }
    return window.selectGoalPeriod('month', key);
  };

  window.toggleGoalStatus = function(id) {
    var data = getData();
    var g = data.goals.find(it => it.id === id);
    if (g) {
      g.done = !g.done;
      g.current = g.done ? 1 : 0;
      setData(data);
      render();
      if (g.done && G.Juice) G.Juice.playSuccess();
    }
  };

  window.toggleHorizon = function(id){
    var c = getCollapsed();
    c[id] = !c[id];
    setCollapsed(c);
    render();
  };

  var editingId = null;
  var MAX_TITLE_LENGTH = 200;

  function normalizeGoalTitle(value) {
    var title = String(value || '').trim();
    if (!title) return { ok: false, error: 'Введите название цели' };
    if (Array.from(title).length > MAX_TITLE_LENGTH) {
      return { ok: false, error: 'Название должно быть не длиннее 200 символов' };
    }
    return { ok: true, value: title };
  }

  function openEdit(g){
    editingId = g.id;
    var titleInput = document.getElementById('editTitle');
    titleInput.value = g.title;
    titleInput.setCustomValidity('');
    
    var editRow = document.getElementById('editCurrent').parentElement;
    if (g.type === 'check') {
        editRow.style.display = 'none';
    } else {
        editRow.style.display = 'block';
        document.getElementById('editCurrent').value = g.current || 0;
    }
    
    document.getElementById('editModal').classList.add('show');
    titleInput.focus();
  }

  document.getElementById('closeBtn').onclick = function(){
    document.getElementById('editTitle').setCustomValidity('');
    document.getElementById('editModal').classList.remove('show');
  };
  document.getElementById('saveBtn').onclick = function(){
    var titleInput = document.getElementById('editTitle');
    var titleResult = normalizeGoalTitle(titleInput.value);
    if (!titleResult.ok) {
      titleInput.setCustomValidity(titleResult.error);
      titleInput.reportValidity();
      titleInput.focus();
      return;
    }
    titleInput.setCustomValidity('');

    var data = getData();
    var g = data.goals.find(it => it.id === editingId);
    if(g){
        g.title = titleResult.value;
        if(g.type === 'number') {
          g.current = parseInt(document.getElementById('editCurrent').value, 10) || 0;
          g.done = g.current >= g.target;
        }
        setData(data);
        render();
    }
    document.getElementById('editModal').classList.remove('show');
  };

  document.getElementById('delBtn').onclick = function(){
    if(!confirm('Удалить эту цель?')) return;
    var data = getData();
    data.goals = data.goals.filter(it => it.id !== editingId);
    setData(data);
    render();
    document.getElementById('editModal').classList.remove('show');
  };

  document.getElementById('addType').onchange = function(){
    document.getElementById('numberFields').style.display = this.value === 'number' ? 'flex' : 'none';
  };

  document.getElementById('addBtn').onclick = function(){
    var title = document.getElementById('addTitle').value.trim();
    if(!title) return;
    var data = getData();
    data.goals.push({
        id: 'hg_'+Date.now(),
        title: title,
        horizon: document.getElementById('addHorizon').value,
        type: document.getElementById('addType').value,
        target: parseInt(document.getElementById('addTarget').value, 10) || 1,
        unit: document.getElementById('addUnit').value || '',
        current: 0,
        done: false
    });
    setData(data);
    document.getElementById('addTitle').value = '';
    render();
  };

  render();
})();
</script>
</body>
</html>
